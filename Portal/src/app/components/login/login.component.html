<div class="login-page min-vh-100 d-flex align-items-center justify-content-center px-3 py-5">
  <div class="container" style="max-width: 1100px;">
    <div class="row align-items-center justify-content-center">

      <!-- Left side: Illustration -->
      <div class="col-12 col-lg-7 text-center d-none d-lg-block pe-lg-5">
        <img src="assets/login-page-lock-img.jpg" alt="Developer Coding" class="img-fluid illustration-img">
      </div>

      <!-- Right side: Login Form (No colored box) -->
      <div class="col-12 col-md-8 col-lg-5">
        <div class="login-container-right p-4 p-md-5">

          <div class="mb-4">
            <h2 class="login-title fw-bold display-6">Login</h2>
            <p class="text-muted small">Please enter your credentials to log in.</p>
          </div>

          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

            <!-- Username Input -->
            <div class="mb-3">
              <label for="username" class="form-label text-muted small fw-medium">Username</label>
              <div class="input-group-custom">
                <span class="input-icon"><i class="pi pi-user text-muted fs-5"></i></span>
                <input type="text" id="username" name="username" [(ngModel)]="username" required
                       class="form-control-custom" placeholder="Enter username">
              </div>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
              <label for="password" class="form-label text-muted small fw-medium">Password</label>
              <div class="input-group-custom">
                <span class="input-icon"><i class="pi pi-lock text-muted fs-5"></i></span>
                <input type="password" id="password" name="password" [(ngModel)]="password" required
                       class="form-control-custom" placeholder="Enter password">
              </div>
            </div>


            <!-- Submit Button (Blue) -->
            <button type="submit" class="btn btn-login w-100 py-3 fs-6 fw-bold d-flex align-items-center justify-content-center gap-2" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              <span>LOGIN</span>
            </button>

          </form>



        </div>
      </div>

    </div>
  </div>

</div>
